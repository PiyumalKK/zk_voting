---
# All nodes use NODE_ID=3001 (each on own EC2) — simplifies ALB routing to port 80 via nginx

- name: Remove old checkout
  file:
    path: /opt/zk-voting
    state: absent

- name: Clone repo
  git:
    repo: "{{ repo_url | default('https://github.com/PiyumalKK/zk_voting.git') }}"
    dest: /opt/zk-voting
    version: "{{ branch | default('Piyumal') }}"

- name: Own by ubuntu
  file:
    path: /opt/zk-voting
    owner: ubuntu
    group: ubuntu
    recurse: yes

- name: Build Go binary
  shell: /snap/bin/go build -o bin/zk-node ./cmd/node
  args:
    chdir: /opt/zk-voting/packages/blockchain
  become_user: ubuntu
  environment:
    HOME: /home/ubuntu
    GOPATH: /home/ubuntu/go

- name: Create data dirs
  file:
    path: "/opt/zk-voting/packages/blockchain/data_3001/{{ item }}"
    state: directory
    owner: ubuntu
  loop: [certs, keys]

- name: Generate admin RSA keypair
  shell: |
    openssl genrsa -out admin_private.pem 2048
    openssl rsa -in admin_private.pem -pubout -out data_3001/keys/admin_public.pem
  args:
    chdir: /opt/zk-voting/packages/blockchain
    creates: "/opt/zk-voting/packages/blockchain/data_3001/keys/admin_public.pem"
  become_user: ubuntu

# The consensus signing key (CONSENSUS_MODE=bft).
#
# Written to a 0600 file rather than passed as an Environment= line, so it
# never appears in `ps -e`, `systemctl show` or the unit file. The value comes
# from a GitHub Actions secret via --extra-vars and is never in this
# repository; no_log keeps it out of Ansible's own output too.
#
# Losing this key does not lose the chain — a validator's blocks are already
# final and signed by a quorum — but it does lose that validator's vote until
# a new key is issued and every node's VALIDATOR_SET is updated, which is a
# coordinated restart.
#
# validator_keys is a dict keyed by inventory hostname, passed whole as
# --extra-vars, because --extra-vars sets one global value and each host needs
# a different key.
- name: Install the validator's consensus signing key
  copy:
    content: "{{ validator_keys[inventory_hostname] }}"
    dest: /opt/zk-voting/packages/blockchain/data_3001/keys/validator.key
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  when:
    - consensus_mode | default('solo') == 'bft'
    - validator_keys is defined
    - validator_keys[inventory_hostname] | default('') | length > 0

# A validator with no key would boot, fail configuration validation and exit,
# and the cluster would silently be one vote short — spending its single
# failure of slack on a missing secret. Better to stop the deploy.
- name: Fail early when a validator has no signing key
  fail:
    msg: >-
      consensus_mode is 'bft' but no signing key was provided for
      {{ inventory_hostname }}. The deploy workflow passes these from the
      VALIDATOR_KEY_NODE1..4 repository secrets as
      -e '{"validator_keys": {...}}'. Set them, or set consensus_mode=solo to
      deploy the single-sequencer topology instead.
  when:
    - consensus_mode | default('solo') == 'bft'
    - validator_keys is not defined or validator_keys[inventory_hostname] | default('') | length == 0

- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Configure nginx (path rewrite /chain-api -> /)
  copy:
    dest: /etc/nginx/sites-available/chain
    content: |
      server {
          listen 80;
          # Matches bare /chain-api AND /chain-api/... — strips the prefix with
          # no 301 redirect (viem POSTs don't follow redirects).
          location /chain-api {
              rewrite ^/chain-api/?(.*)$ /$1 break;
              proxy_pass http://127.0.0.1:3001;
              proxy_set_header Host $host;
          }
          location /nginx-health {
              return 200 '{"status":"ok"}';
              add_header Content-Type application/json;
          }
          location / {
              proxy_pass http://127.0.0.1:3001;
          }
      }

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/chain
    dest: /etc/nginx/sites-enabled/chain
    state: link

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Reload nginx
  service:
    name: nginx
    state: restarted

- name: Template systemd service (NODE_ID=3001, no PEERS)
  template:
    src: zk-node.service.j2
    dest: /etc/systemd/system/zk-node.service

- name: Enable and start zk-node
  systemd:
    name: zk-node
    enabled: yes
    state: restarted
    daemon_reload: yes
