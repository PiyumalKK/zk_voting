---
- name: Remove old checkout
  file:
    path: /opt/zk-voting
    state: absent

- name: Clone repo
  git:
    repo: "{{ repo_url | default('https://github.com/PiyumalKK/zk_voting.git') }}"
    dest: /opt/zk-voting
    version: "{{ branch | default('Piyumal') }}"
  become_user: ubuntu

- name: Build Go binary
  shell: /snap/bin/go build -o bin/zk-node ./cmd/node
  args:
    chdir: /opt/zk-voting/packages/blockchain
  become_user: ubuntu
  environment:
    HOME: /home/ubuntu
    GOPATH: /home/ubuntu/go

- name: Generate admin RSA keypair (if missing)
  shell: |
    openssl genrsa -out admin_private.pem 2048
    openssl rsa -in admin_private.pem -pubout -out data_{{ node_id }}/keys/admin_public.pem
  args:
    chdir: /opt/zk-voting/packages/blockchain
    creates: "/opt/zk-voting/packages/blockchain/data_{{ node_id }}/keys/admin_public.pem"
  become_user: ubuntu

- name: Template systemd service
  template:
    src: zk-node.service.j2
    dest: /etc/systemd/system/zk-node.service

- name: Enable and start zk-node
  systemd:
    name: zk-node
    enabled: yes
    state: restarted
    daemon_reload: yes
