name: Deploy Blockchain Nodes Only

# Reconfigures/redeploys ONLY the blockchain node servers (Go node + nginx + certs).
# The web server is left completely untouched.
# NOTE: This restarts nodes and can reset chain data — do NOT run this for a
# routine web/UI change. Use "Deploy Web Server Only" for that.

on:
  workflow_dispatch:

jobs:
  inventory:
    name: Generate Inventory
    runs-on: ubuntu-latest
    outputs:
      node1_ip: ${{ steps.ips.outputs.node1 }}
      node2_ip: ${{ steps.ips.outputs.node2 }}
      node3_ip: ${{ steps.ips.outputs.node3 }}
      node4_ip: ${{ steps.ips.outputs.node4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init
      - name: Get IPs
        id: ips
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "node1=$(terraform output -json node_public_ips | jq -r '.[0]')" >> $GITHUB_OUTPUT
          echo "node2=$(terraform output -json node_public_ips | jq -r '.[1]')" >> $GITHUB_OUTPUT
          echo "node3=$(terraform output -json node_public_ips | jq -r '.[2]')" >> $GITHUB_OUTPUT
          echo "node4=$(terraform output -json node_public_ips | jq -r '.[3]')" >> $GITHUB_OUTPUT
      - name: Generate inventory
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python infra/scripts/gen_inventory.py infra/terraform > infra/ansible/inventory.yml
      - uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: infra/ansible/inventory.yml

  deploy-nodes:
    name: Deploy Blockchain Nodes
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible
      - uses: actions/download-artifact@v4
        with:
          name: inventory
          path: infra/ansible/
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/zk-voting-key.pem
          chmod 400 ~/.ssh/zk-voting-key.pem
      # --limit nodes → only blockchain hosts; the web play is skipped entirely
      #
      # The validator signing keys (CONSENSUS_MODE=bft) are passed as a
      # host-keyed dict, because --extra-vars sets one global value and each
      # validator needs a different key. They come from repository secrets and
      # are never in git; the role writes each to a 0600 file with no_log, so
      # they appear neither in this log nor in `ps -e` on the host.
      #
      # A validator whose key is missing stops the deploy rather than booting
      # one vote short — see the guard in roles/blockchain/tasks/main.yml.
      - name: Deploy to all nodes
        working-directory: infra/ansible
        env:
          VALIDATOR_KEY_NODE1: ${{ secrets.VALIDATOR_KEY_NODE1 }}
          VALIDATOR_KEY_NODE2: ${{ secrets.VALIDATOR_KEY_NODE2 }}
          VALIDATOR_KEY_NODE3: ${{ secrets.VALIDATOR_KEY_NODE3 }}
          VALIDATOR_KEY_NODE4: ${{ secrets.VALIDATOR_KEY_NODE4 }}
        run: |
          VALIDATOR_KEYS=$(jq -cn \
            --arg n1 "$VALIDATOR_KEY_NODE1" \
            --arg n2 "$VALIDATOR_KEY_NODE2" \
            --arg n3 "$VALIDATOR_KEY_NODE3" \
            --arg n4 "$VALIDATOR_KEY_NODE4" \
            '{validator_keys: {node1: $n1, node2: $n2, node3: $n3, node4: $n4}}')
          ansible-playbook playbook.yml -i inventory.yml --limit nodes -v \
            -e "$VALIDATOR_KEYS"

  health-check:
    name: Health Check
    needs: [inventory, deploy-nodes]
    runs-on: ubuntu-latest
    steps:
      - name: Check all nodes
        run: |
          for ip in ${{ needs.inventory.outputs.node1_ip }} \
                    ${{ needs.inventory.outputs.node2_ip }} \
                    ${{ needs.inventory.outputs.node3_ip }} \
                    ${{ needs.inventory.outputs.node4_ip }}; do
            echo "=== $ip ==="
            curl -sf --max-time 10 "http://$ip:3001/health" || echo "NOT READY"
            echo
            # Under CONSENSUS_MODE=bft, "the process is up" is not the
            # question — a validator that cannot reach its peers is up and
            # useless. zk_consensusStatus reports whose turn it is and whether
            # this node is caught up, which is what actually says the cluster
            # is working. Answers -32601 in solo mode, which is expected.
            curl -sf --max-time 10 -X POST "http://$ip:3001" \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"zk_consensusStatus","params":[]}' || true
            echo
          done
