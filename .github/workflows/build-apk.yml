name: Build Mobile App (APK / AAB)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: preview = APK (sideload/testing), production = AAB (Play Store)"
        type: choice
        default: preview
        options:
          - preview
          - production

jobs:
  get-alb-url:
    name: Get public HTTPS URL from Terraform
    runs-on: ubuntu-latest
    outputs:
      public_host: ${{ steps.get_url.outputs.public_host }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init
      - name: Get CloudFront domain
        id: get_url
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          HOST=$(terraform output -raw cloudfront_domain)
          echo "public_host=$HOST" >> $GITHUB_OUTPUT
          echo "✅ Using HTTPS host: $HOST"

  build:
    name: Build Android App
    needs: get-alb-url
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Inject HTTPS URLs into eas.json (the chosen profile's env is embedded by EAS at build time)
        run: |
          cd packages/mobile
          HOST="${{ needs.get-alb-url.outputs.public_host }}"
          PROFILE="${{ inputs.profile }}"
          # Inject the live CloudFront HTTPS URL into BOTH profiles so either
          # build type is correct (Android blocks cleartext HTTP).
          jq --arg api "https://$HOST" --arg rpc "https://$HOST/chain-api" \
            '.build.preview.env.EXPO_PUBLIC_API_URL = $api
             | .build.preview.env.EXPO_PUBLIC_RPC_URL = $rpc
             | .build.preview.env.EXPO_PUBLIC_CHAIN_ID = "9494"
             | .build.production.env.EXPO_PUBLIC_API_URL = $api
             | .build.production.env.EXPO_PUBLIC_RPC_URL = $rpc
             | .build.production.env.EXPO_PUBLIC_CHAIN_ID = "9494"' \
            eas.json > eas.json.tmp && mv eas.json.tmp eas.json
          echo "✅ eas.json $PROFILE.env now points at HTTPS host: $HOST"
          jq ".build.$PROFILE.env" eas.json
      - name: Install dependencies
        run: cd packages/mobile && yarn install
      - name: Build app (${{ inputs.profile }})
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd packages/mobile
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
      - name: Show build info
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            echo "📦 AAB (Play Store) build submitted to EAS!"
          else
            echo "📱 APK (sideload/testing) build submitted to EAS!"
          fi
          echo "   Check build status: https://expo.dev/accounts/piyumalkk/projects/sl-vote/builds"
          echo ""
          echo "   Config baked into this build:"
          echo "   API: https://${{ needs.get-alb-url.outputs.public_host }}"
          echo "   RPC: https://${{ needs.get-alb-url.outputs.public_host }}/chain-api"
