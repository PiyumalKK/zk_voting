name: Deploy Application (Full)

# Full deploy: blockchain nodes + web app together, on a fresh chain.
# For routine updates use the scoped workflows instead:
#   • "Deploy Web Server Only"        → UI/app change, nodes untouched
#   • "Deploy Blockchain Nodes Only"  → node change, web untouched

on:
  workflow_dispatch:

jobs:
  inventory:
    name: Generate Inventory
    runs-on: ubuntu-latest
    outputs:
      node1_ip: ${{ steps.ips.outputs.node1 }}
      node2_ip: ${{ steps.ips.outputs.node2 }}
      node3_ip: ${{ steps.ips.outputs.node3 }}
      node4_ip: ${{ steps.ips.outputs.node4 }}
      web_ip: ${{ steps.ips.outputs.web }}
      inventory: ${{ steps.inv.outputs.content }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init
      # `terraform output` reads state; it does NOT contact AWS. An instance that is
      # stopped and started is given a NEW public IP, so state silently goes stale and
      # the generated inventory sends Ansible to addresses that no longer exist — which
      # surfaces as "Connection timed out" on port 22, not a refusal, because the
      # packets reach nothing at all. Refreshing first keeps the inventory truthful.
      # -refresh-only updates state to match reality without changing infrastructure.
      - name: Refresh Terraform state
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform apply -refresh-only -auto-approve
      - name: Get IPs
        id: ips
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "node1=$(terraform output -json node_public_ips | jq -r '.[0]')" >> $GITHUB_OUTPUT
          echo "node2=$(terraform output -json node_public_ips | jq -r '.[1]')" >> $GITHUB_OUTPUT
          echo "node3=$(terraform output -json node_public_ips | jq -r '.[2]')" >> $GITHUB_OUTPUT
          echo "node4=$(terraform output -json node_public_ips | jq -r '.[3]')" >> $GITHUB_OUTPUT
          echo "web=$(terraform output -raw web_public_ip)" >> $GITHUB_OUTPUT
      - name: Generate inventory
        id: inv
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python infra/scripts/gen_inventory.py infra/terraform > infra/ansible/inventory.yml
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat infra/ansible/inventory.yml >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: infra/ansible/inventory.yml

  deploy-nodes:
    name: Deploy Blockchain Nodes
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible
      - uses: actions/download-artifact@v4
        with:
          name: inventory
          path: infra/ansible/
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/zk-voting-key.pem
          chmod 400 ~/.ssh/zk-voting-key.pem
      # All nodes in one play so the fetch→copy cert distribution works on the same runner.
      #
      # The validator signing keys (CONSENSUS_MODE=bft) go in as a host-keyed
      # dict, because --extra-vars sets one global value and each validator
      # needs a different key. Same handling as deploy-nodes.yml: from
      # repository secrets, never from git, written to a 0600 file with no_log.
      # A validator whose key is missing stops the deploy rather than booting
      # one vote short.
      - name: Deploy to all nodes
        working-directory: infra/ansible
        env:
          VALIDATOR_KEY_NODE1: ${{ secrets.VALIDATOR_KEY_NODE1 }}
          VALIDATOR_KEY_NODE2: ${{ secrets.VALIDATOR_KEY_NODE2 }}
          VALIDATOR_KEY_NODE3: ${{ secrets.VALIDATOR_KEY_NODE3 }}
          VALIDATOR_KEY_NODE4: ${{ secrets.VALIDATOR_KEY_NODE4 }}
        run: |
          VALIDATOR_KEYS=$(jq -cn \
            --arg n1 "$VALIDATOR_KEY_NODE1" \
            --arg n2 "$VALIDATOR_KEY_NODE2" \
            --arg n3 "$VALIDATOR_KEY_NODE3" \
            --arg n4 "$VALIDATOR_KEY_NODE4" \
            '{validator_keys: {node1: $n1, node2: $n2, node3: $n3, node4: $n4}}')
          ansible-playbook playbook.yml -i inventory.yml --limit nodes -v \
            -e "$VALIDATOR_KEYS"

  deploy-web:
    name: Deploy Web Server
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible
      - uses: actions/download-artifact@v4
        with:
          name: inventory
          path: infra/ansible/
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/zk-voting-key.pem
          chmod 400 ~/.ssh/zk-voting-key.pem
      - name: Deploy to Web Server
        working-directory: infra/ansible
        run: ansible-playbook playbook.yml -i inventory.yml --limit webserver -e "redeploy_contracts=true" -v

  health-check:
    name: Health Check
    needs: [deploy-nodes, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: Check all nodes
        run: |
          echo "=== Node 1 ==="
          curl -sf --max-time 10 http://${{ needs.inventory.outputs.node1_ip }}:3001/health || echo "NOT READY"
          echo "=== Node 2 ==="
          curl -sf --max-time 10 http://${{ needs.inventory.outputs.node2_ip }}:3001/health || echo "NOT READY"
          echo "=== Node 3 ==="
          curl -sf --max-time 10 http://${{ needs.inventory.outputs.node3_ip }}:3001/health || echo "NOT READY"
          echo "=== Node 4 ==="
          curl -sf --max-time 10 http://${{ needs.inventory.outputs.node4_ip }}:3001/health || echo "NOT READY"
          echo "=== Web ==="
          curl -sf --max-time 10 http://${{ needs.inventory.outputs.web_ip }}:3000 | head -c 100 || echo "NOT READY"
          echo ""
          echo "✅ ALB URL: http://zk-voting-alb-712299694.ap-south-1.elb.amazonaws.com"
